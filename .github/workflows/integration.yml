name: Pull request mobile gates

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mobile-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify critical integration scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_critical: ${{ steps.paths.outputs.run_critical }}

    steps:
      - name: Checkout complete pull-request history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed_file="$RUNNER_TEMP/changed-paths.txt"
          if ! git diff --name-only --diff-filter=ACMR \
            "$BASE_SHA" "$HEAD_SHA" > "$changed_file"; then
            echo "run_critical=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t changed_paths < "$changed_file"
          result="$(bash tool/ci/classify_integration_paths.sh \
            "${changed_paths[@]}")"
          if [[ "$result" != "true" && "$result" != "false" ]]; then
            result=true
          fi
          echo "run_critical=$result" >> "$GITHUB_OUTPUT"

  critical-android:
    name: Android critical integration
    needs: classify
    if: ${{ needs.classify.outputs.run_critical == 'true' }}
    uses: ./.github/workflows/mobile-quality-gates.yml
    with:
      run_android_critical: true
      run_android_benchmark: false
      run_ios_critical: false
      benchmark_mode: enforce
      artifact_suffix: pr-critical

  performance-android:
    name: Android performance gate
    uses: ./.github/workflows/mobile-quality-gates.yml
    with:
      run_android_critical: false
      run_android_benchmark: true
      run_ios_critical: false
      benchmark_mode: enforce
      artifact_suffix: pr-performance

  integration-gate:
    name: Integration gate
    if: always()
    needs: [classify, critical-android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the expected critical-suite conclusion
        env:
          CLASSIFICATION: ${{ needs.classify.result }}
          RUN_CRITICAL: ${{ needs.classify.outputs.run_critical }}
          CRITICAL_RESULT: ${{ needs.critical-android.result }}
        run: |
          set -euo pipefail
          test "$CLASSIFICATION" = "success"
          if [[ "$RUN_CRITICAL" == "true" ]]; then
            test "$CRITICAL_RESULT" = "success"
          else
            test "$CRITICAL_RESULT" = "skipped"
          fi
