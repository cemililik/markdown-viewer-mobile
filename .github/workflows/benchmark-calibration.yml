name: Final positive mobile quality proof

on:
  push:
    branches: [development]

permissions:
  contents: read

jobs:
  final-positive:
    name: Final positive mobile quality proof
    uses: ./.github/workflows/mobile-quality-gates.yml
    with:
      run_android_critical: true
      run_android_benchmark: true
      run_ios_critical: true
      benchmark_mode: enforce
      artifact_suffix: final-positive
